[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
solc = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{access = "read", path = "./lib/v4-periphery/lib/v4-core/test/bin/v3Factory.bytecode"}, {access = "read", path = "./test/bin/nonFungiblePositionManager.bytecode"}, {access = "read", path = "./test/bin/swapRouter.bytecode"}]

[fuzz]
runs = 10_000

[invariant]
runs = 500
depth = 20
fail_on_revert = true

# ci: local (non-fork) tests — higher fuzz coverage
[profile.ci.fuzz]
runs = 10_000

# ci-fork: fork tests — fewer runs (RPC calls are slow)
[profile.ci-fork.fuzz]
runs = 10

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}" 
base= "${BASE_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
